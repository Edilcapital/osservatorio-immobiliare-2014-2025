<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osservatorio Mercato Immobiliare Italiano 2014-2025</title>
<style>body{font-family:system-ui,sans-serif;background:#f8f7f4;color:#1e293b;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}#s{font-size:14px;color:#64748b}</style>
</head>
<body>
<p id="s">Caricamento report…</p>
<script>
(async () => {
  try {
    const res = await fetch('report.b64.txt');
    if (!res.ok) throw new Error('fetch ' + res.status);
    const b64 = (await res.text()).trim();
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('s').textContent = 'Errore di caricamento: ' + e.message;
  }
})();
</script>
</body>
</html>
